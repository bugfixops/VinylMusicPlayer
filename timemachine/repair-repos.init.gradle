// Gradle init script: make 2017-2020 era Android builds resolvable in 2026.
//
// jcenter.bintray.com is gone (301 -> 404) and every Themis instrumented
// branch declares it. Rather than editing each build.gradle, rewrite every
// repository declaration at configuration time:
//   jcenter / bintray  ->  google + mavenCentral + aliyun mirror + jitpack
//
// A jcenter substitute is genuinely required: anko-commons 0.10.8,
// okhttp-digest 1.18 and jacoco-android 0.1.3 are used by these subjects and
// were never republished to Maven Central.
//
// huaweicloud is used for it rather than the aliyun mirror. Aliyun serves the
// artifacts but answers 502/404 unpredictably for maven-metadata.xml, and a
// failed metadata fetch aborts resolution of a dynamic version
// (androidx.room:room-migration:[2.2.2]) instead of falling through to the next
// repository. huaweicloud answers metadata requests reliably.

def fixup = { repos ->
    def dead = repos.findAll { r ->
        r instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository &&
        r.url.toString() =~ /bintray\.com/
    }
    dead.each { repos.remove(it) }

    // Order matters. Gradle fetches an artifact from whichever repository
    // supplied its metadata, so a mirror that has the .pom but not the .jar
    // (huaweicloud does this for gradle plugin jars such as spotbugs and
    // detekt) breaks the build if it is consulted first. Canonical sources go
    // ahead of the jcenter stand-in, which stays last as a pure fallback.
    repos.maven { url 'https://maven.google.com' }
    repos.mavenCentral()
    repos.maven { url 'https://plugins.gradle.org/m2' }
    repos.maven { url 'https://jitpack.io' }
    repos.maven { url 'https://repo.huaweicloud.com/repository/maven' }  // jcenter stand-in
    // ODK Collect 1.23 depends on org.getodk:javarosa:2.18.0-SNAPSHOT
    repos.maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
    repos.maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots' }
    // sunflower 0.1.6 pins kotlin-gradle-plugin:1.3.0-rc-116, a pre-release that
    // only ever existed in the Kotlin EAP channel (formerly on bintray).
    repos.maven { url 'https://maven.pkg.jetbrains.space/kotlin/p/kotlin/eap' }
    repos.maven { url 'https://maven.pkg.jetbrains.space/kotlin/p/kotlin/dev' }
    // Some subjects resolve local support-library artifacts from the SDK.
    def sdkM2 = new File(System.getenv('ANDROID_SDK_ROOT') ?: '/home/ubuntu/android-sdk',
                         'extras/m2repository')
    if (sdkM2.isDirectory()) { repos.maven { url sdkM2.toURI().toString() } }
}

allprojects { p ->
    fixup(p.buildscript.repositories)
    fixup(p.repositories)
    p.afterEvaluate { fixup(p.repositories) }
}

// Code-quality gates have to come off. The Jacoco harness injected into
// upstream checkouts is not written to each project's style rules, so NewPipe's
// runCheckstyle task fails the build on 44 violations in the two harness files.
// None of these checks affect whether an instrumented APK is produced.
def qualityTask = ~/(?i).*(checkstyle|ktlint|detekt|spotbugs|findbugs|pmd|spotless|licensee|dependencyAnalysis).*/
allprojects { p ->
    p.tasks.matching { it.name ==~ qualityTask }.all { it.enabled = false }
    p.tasks.matching { it.name ==~ ~/(?i)lint(?!Vital).*/ }.all { it.enabled = false }
}

